[workspace]
resolver = "2"
members = [
  "crates/rules",
  "crates/ai",
  "crates/protocol",
  "crates/server",
  "crates/rules-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# テストは、AI の対局など、計算が重いものがある。最適化して実行する（デバッグ用の検査は残す）
[profile.test]
opt-level = 2

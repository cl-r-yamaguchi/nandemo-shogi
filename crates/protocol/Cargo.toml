[package]
name = "protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", optional = true }
rules = { path = "../rules" }

[features]
# TypeScript の型の生成。既定で有効（`cargo test` で `web/src/net/generated/` に出力する）。
# サーバーは、`default-features = false` で依存して、外せる。
default = ["ts"]
ts = ["dep:ts-rs", "rules/ts"]
